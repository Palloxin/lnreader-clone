steps:
  - echo: Restart the disposable API 37 emulator app and restore a selected
      benchmark archive.
  - launch: com.rajarsheechatterjee.LNReader.debug
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: DEVELOPMENT SERVERS
  - echo: Select the configured local Metro server and wait for the reader screen.
  - tap:
      x: 0.5
      y: 0.744
  - echo: Dismiss the development menu to reach the reader home screen.
  - tap:
      text: Continue
  - echo: Close the developer overlay and complete the fresh-install welcome setup.
  - tap:
      text: Close
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Welcome
  - echo: Keep the default theme and finish onboarding to open the reader.
  - tap:
      id: button-text
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: New update available
  - echo: Defer the optional app update and continue with the current debug build.
  - tap:
      id: button-text
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Search library
  - echo: Open More to reach the local backup controls.
  - tap:
      x: 0.9
      y: 0.929
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Task Queue
  - echo: Open Settings and then the Backup screen.
  - tap:
      text: Settings
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Settings
  - echo: Open the Backup settings screen.
  - tap:
      text: Backup
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Local Backup
  - echo: Choose the local restore action and select the v2 benchmark archive in
      Android's document picker.
  - tap:
      text: Restore backup
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Recent files
  - echo: Open storage locations and navigate to Downloads.
  - tap:
      text: Show roots
  - tap:
      x: 0.335
      y: 0.211
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: lnreader_backup.zip
  - echo: Select the validated v2 test archive.
  - tap:
      id: android:id/title
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Changes already restored
  - echo: Confirm the restore and wait for the local restore task to complete.
  - tap:
      x: 0.795
      y: 0.578
  - echo: Decline notifications because the restore benchmark does not need them.
  - tap:
      id: com.android.permissioncontroller:id/permission_deny_button
  - echo: Open Task Queue and verify the restore result and progress.
  - tap:
      role: StaticText
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Settings
  - echo: Return to More and open the queue.
  - tap:
      role: StaticText
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Task Queue
  - tap:
      text: Task Queue
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Local Restore

  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: No running tasks
  - tool: button
    args:
      button: back
  - tap:
      x: 0.1
      y: 0.9293
  - tap:
      text: Search library
  - tool: keyboard
    args:
      text: Shadow Slave
  - tool: button
    args:
      button: back
  - tap:
      text: Currently Reading
  - tool: gesture-swipe
    args:
      fromX: 0.9
      fromY: 0.167
      toX: 0.15
      toY: 0.167
      durationMs: 300
  - tap:
      text: Done Downloading
