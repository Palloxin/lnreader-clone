executionPrerequisite: LNReader's Android development build is on the DEVELOPMENT SERVERS screen, Metro is running at http://192.168.0.214:8081, and the matched v3 archive is in Downloads as lnreader_backup_v3.zip.

steps:
  - echo: Connect the fresh development client to the local Metro server.
  - tap:
      text: http://
  - tool: keyboard
    args:
      text: http://192.168.0.214:8081
  - tap:
      text: Connect
  - await: { visible: { text: Continue } }
  - await: { idle: true }
  - tap:
      text: Continue
  - await: { visible: { text: Close } }
  - await: { idle: true }
  - tap:
      text: Close
  - await: { visible: { text: Welcome } }
  - await: { idle: true }
  - echo: Keep the default theme and complete onboarding.
  - tap:
      text: Complete
  - await: { visible: { text: New update available } }
  - await: { idle: true }
  - echo: Defer the optional update and use the current debug build.
  - tap:
      text: Later
  - await: { visible: { text: Search library } }
  - await: { idle: true }
  - echo: Open More, then Settings and Backup.
  - tap:
      text: More
  - await: { visible: { text: Settings } }
  - await: { idle: true }
  - tap:
      text: Settings
  - await: { visible: { id: appbar-content-title-text, text: Settings } }
  - await: { idle: true }
  - echo: Open the Backup settings screen.
  - tap:
      text: Backup
  - await: { visible: { text: Local Backup } }
  - await: { idle: true }
  - tap:
      text: Restore backup
  - await: { visible: { text: lnreader_backup_v3.zip } }
  - await: { idle: true }
  - echo: Select the matched v3 archive; this fixture has downloaded-file restore disabled.
  - tap:
      id: android:id/title
  - await: { visible: { text: Changes already restored } }
  - await: { idle: true }
  - echo: Confirm the restore and inspect its queued progress.
  - tap:
      text: Restore
  - await:
      visible:
        id: 'com.android.permissioncontroller:id/permission_deny_button'
      timeout: 15000
  - await: { idle: true }
  - echo: Decline notifications because this data restore does not use them.
  - tap:
      id: com.android.permissioncontroller:id/permission_deny_button
  - await: { visible: { text: Local Backup } }
  - await: { idle: true }
  - echo: Return through Settings to the task queue while the restore runs.
  - tool: button
    args:
      button: back
  - await: { visible: { id: appbar-content-title-text, text: Settings } }
  - await: { idle: true }
  - echo: Return to More to open Task Queue.
  - tool: button
    args:
      button: back
  - await: { visible: { text: Task Queue } }
  - await: { idle: true }
  - echo: Open Task Queue and capture the running restore state.
  - tap:
      text: Task Queue
  - await: { visible: { text: Local Restore } }
  - await: { visible: { text: No running tasks }, timeout: 300000 }
  - await: { idle: true }
  - echo: Return to Library after the local restore task finishes.
  - tool: button
    args:
      button: back
  - await: { visible: { text: Task Queue } }
  - await: { idle: true }
  - tap:
      text: Library
  - await: { visible: { text: Search library } }
  - await: { idle: true }
